name: Build Unsigned APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TraderApp/**'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Pin .NET 8 SDK
      run: |
        echo '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}' > global.json
        dotnet --version

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android --skip-sign-check

    - name: Restore
      run: dotnet restore TRADER.sln -p:TargetFramework=net8.0-android

    - name: Build unsigned APK
      run: >
        dotnet publish src/TraderApp/TraderUI.csproj
        -c Release
        -p:TargetFramework=net8.0-android
        -p:AndroidPackageFormat=apk
        -p:AndroidSignKeyStore=
        -p:RuntimeIdentifier=android-arm64
        --no-restore

    - name: Locate APK
      run: |
        APK_PATH=$(find src/TraderApp/bin -name "*.apk" -type f 2>/dev/null | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "ERROR: No APK found"
          find src/TraderApp/bin -type f | head -30
          exit 1
        fi
        echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
        ls -lh "$APK_PATH"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TRADER-Android-APK
        path: ${{ env.APK_PATH }}
        retention-days: 30
