name: Build Unsigned Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TraderApp/**'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Pin .NET 8 SDK
      run: |
        echo '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}' > global.json
        dotnet --version

    - name: Install MAUI Windows workload
      run: dotnet workload install maui-windows --skip-sign-check

    - name: Restore
      run: dotnet restore TRADER.sln -p:TargetFramework=net8.0-windows10.0.19041.0

    - name: Build unsigned EXE
      run: >
        dotnet publish src/TraderApp/TraderUI.csproj
        -c Release
        -p:TargetFramework=net8.0-windows10.0.19041.0
        -p:RuntimeIdentifier=win-x64
        -p:WindowsPackageType=None
        -p:SelfContained=true
        -p:EnableCodeSigning=false
        --no-restore

    - name: Locate EXE
      run: |
        $exePath = Get-ChildItem -Path src\TraderApp\bin -Filter "TraderUI.exe" -Recurse | Select-Object -First 1
        if (-not $exePath) {
          Write-Error "ERROR: No EXE found"
          Get-ChildItem -Path src\TraderApp\bin -Recurse | Select-Object -First 30
          exit 1
        }
        $publishDir = $exePath.DirectoryName
        Write-Host "Publish dir: $publishDir"
        echo "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV
        dir $publishDir

    - name: Create ZIP archive
      run: |
        Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath "TRADER-Windows-x64.zip"
        ls TRADER-Windows-x64.zip

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: TRADER-Windows-EXE
        path: TRADER-Windows-x64.zip
        retention-days: 30
