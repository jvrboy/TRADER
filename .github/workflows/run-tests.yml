name: Run Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TraderApp/**'
      - 'tests/TraderApp.Tests/**'
      - '.github/workflows/run-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore tests/TraderApp.Tests/TraderApp.Tests.csproj

    - name: Build
      run: dotnet build tests/TraderApp.Tests/TraderApp.Tests.csproj --no-restore -c Release

    - name: Test
      run: dotnet test tests/TraderApp.Tests/TraderApp.Tests.csproj --no-build -c Release --verbosity normal
