name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TraderApp/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Pin .NET 8 SDK
      run: |
        echo '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}' > global.json
        dotnet --version

    - name: Install MAUI workloads
      run: |
        dotnet workload install maui-ios --skip-sign-check
        dotnet workload install maui-android --skip-sign-check

    - name: Select Xcode
      run: |
        ls /Applications/ | grep Xcode
        XCODE_PATH=$(ls -d /Applications/Xcode*.app/Contents/Developer 2>/dev/null | sort -V | tail -1)
        if [ -n "$XCODE_PATH" ]; then
          sudo xcode-select -s "$XCODE_PATH"
        fi
        xcodebuild -version

    - name: Restore
      run: dotnet restore src/TraderApp/TraderUI.csproj -p:TargetFramework=net8.0-ios -r ios-arm64

    - name: Build unsigned IPA
      run: >
        dotnet publish src/TraderApp/TraderUI.csproj
        -c Release
        -p:TargetFramework=net8.0-ios
        -p:RuntimeIdentifier=ios-arm64
        -p:BuildIpa=true
        -p:ArchiveOnBuild=false
        -p:EnableCodeSigning=false
        --no-restore

    - name: Locate IPA
      run: |
        IPA_PATH=$(find src/TraderApp/bin -name "*.ipa" -type f 2>/dev/null | head -1)
        if [ -z "$IPA_PATH" ]; then
          echo "No .ipa found, creating from .app bundle..."
          APP_PATH=$(find src/TraderApp/bin -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found .app: $APP_PATH"
            mkdir -p /tmp/ipa-out/Payload
            cp -R "$APP_PATH" /tmp/ipa-out/Payload/
            cd /tmp/ipa-out && zip -r "$GITHUB_WORKSPACE/TRADER.ipa" Payload
            IPA_PATH="$GITHUB_WORKSPACE/TRADER.ipa"
          fi
        fi
        if [ -z "$IPA_PATH" ]; then
          echo "ERROR: No IPA or .app found"
          find src/TraderApp/bin -type f -o -type d 2>/dev/null | head -50
          exit 1
        fi
        echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
        ls -lh "$IPA_PATH"

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TRADER-iOS-IPA
        path: ${{ env.IPA_PATH }}
        retention-days: 30
