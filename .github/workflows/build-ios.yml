name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/TraderApp/**'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install iOS & MAUI workloads
      run: |
        dotnet workload install maui-ios --skip-sign-check
        dotnet workload install maui-android --skip-sign-check

    - name: Select Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode_16.xt/Xcode.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.4.xt/Xcode.app/Contents/Developer || \
        sudo xcode-select -s /Applications/Xcode_15.2.xt/Xcode.app/Contents/Developer || \
        echo "Using default Xcode"
        xcodebuild -version

    - name: Restore dependencies
      run: dotnet restore src/TraderApp/TraderUI.csproj -f net8.0-ios

    - name: Build unsigned IPA
      run: >
        dotnet publish src/TraderApp/TraderUI.csproj
        -c Release
        -f net8.0-ios
        -p:RuntimeIdentifier=ios-arm64
        -p:BuildIpa=true
        -p:CodesignKey=
        -p:CodesignProvision=
        -p:ArchiveOnBuild=false
        --no-restore

    - name: Find and upload IPA
      run: |
        IPA_PATH=$(find src/TraderApp/bin/Release -name "*.ipa" -type f | head -1)
        if [ -z "$IPA_PATH" ]; then
          echo "Looking for .app bundle instead..."
          APP_PATH=$(find src/TraderApp/bin/Release -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found .app bundle: $APP_PATH"
            mkdir -p /tmp/ipa-output/Payload
            cp -R "$APP_PATH" /tmp/ipa-output/Payload/
            cd /tmp/ipa-output && zip -r "$GITHUB_WORKSPACE/TRADER.ipa" Payload
            IPA_PATH="$GITHUB_WORKSPACE/TRADER.ipa"
          fi
        fi
        if [ -z "$IPA_PATH" ]; then
          echo "ERROR: No IPA or .app found"
          find src/TraderApp/bin/Release -type f -o -type d | head -50
          exit 1
        fi
        echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
        echo "Found IPA: $IPA_PATH"
        ls -lh "$IPA_PATH"

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: TRADER-iOS-IPA
        path: ${{ env.IPA_PATH }}
        retention-days: 30
